steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deployment/Dockerfile", "-t", "$_IMAGE", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_IMAGE"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - clientiq-api
      - --image=$_IMAGE
      - --region=$_REGION
      - --platform=managed
images:
  - "$_IMAGE"
