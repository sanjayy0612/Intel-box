services:
  mongo:
    image: mongo:7
    container_name: intelbox-mongo
    ports:
      - "27017:27017"
    # Bind-mounted rather than a named volume so the database lives beside the
    # repo instead of under /var/lib/docker, which on a split-partition install
    # is usually the small one.
    volumes:
      - ./data/mongo:/data/db
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - searxng
    environment:
      SEARXNG_URL: http://searxng:8080

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # SearXNG refuses to start while server.secret_key is still the upstream
    # placeholder, so SEARXNG_SECRET has to be set. It lives in the project .env
    # rather than in this file, which is committed.
    env_file:
      - ../.env
    restart: unless-stopped
