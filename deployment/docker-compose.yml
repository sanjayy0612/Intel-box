services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - searxng
    environment:
      SEARXNG_URL: http://searxng:8080

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    restart: unless-stopped
